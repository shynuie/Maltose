[project]
name = "maltose"
version = "0.1.0"
description = "Early-stage personal assistant project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.1.1",
    "sounddevice>=0.5.0",
    "webrtcvad-wheels>=2.0.14",
]

[project.optional-dependencies]
wake = [
    "pypinyin>=0.55.0",
    "sentencepiece>=0.2.0",
    "sherpa-onnx",
    "sherpa-onnx-core==1.13.8",
]
funasr = [
    "funasr>=1.3.0",
    "kaldi-native-fbank>=1.21.0",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "transformers==4.57.6",
]
qwen-asr = [
    "qwen-asr>=0.0.6",
    "transformers==4.57.6",
]
embeddings = [
    "sentence-transformers>=3.4.0",
    "torch>=2.6.0",
    "transformers>=4.51.0",
]
vector-memory = [
    "fonttools>=4.50.0",
    "lancedb>=0.20.0",
    "pypdf>=5.0.0",
    "sentence-transformers>=3.4.0",
    "torch>=2.6.0",
    "transformers>=4.51.0",
]
speaker = [
    "speechbrain>=1.0.0",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
]

[project.scripts]
maltose = "maltose.agent.cli:main"
maltose-run = "maltose.agent.cli:main"
maltose-listen = "maltose.voice.listen_cli:main"
maltose-stt = "maltose.voice.stt_cli:main"
maltose-tts = "maltose.voice.cli:main"
maltose-voice-loop = "maltose.voice.loop_cli:main"
maltose-wake-test = "maltose.voice.wake_cli:main"
maltose-wake-monitor = "maltose.voice.wake_monitor_cli:main"
maltose-kws-record = "maltose.voice.kws_record_cli:main"
maltose-kws-manifest = "maltose.voice.kws_manifest_cli:main"
maltose-kws-replay = "maltose.voice.kws_replay_cli:main"
maltose-kws-mix = "maltose.voice.kws_mix_cli:main"
maltose-vad-replay = "maltose.voice.vad_replay_cli:main"
maltose-speaker-enroll = "maltose.voice.speaker_enroll_interactive:main"
maltose-speaker-enroll-files = "maltose.voice.speaker_enroll_cli:main"
maltose-speaker-test = "maltose.voice.speaker_test_cli:main"
maltose-documents = "maltose.knowledge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
