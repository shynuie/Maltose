# Remote ModelScope training config for raw real+TTS data with clean/speed augmentation.
# Paths are inside the training container (/workspace/data).
work_dir: /workspace/data/kws/training/marvin-mini/work-3ch-split4-real-tts1000-raw-clean35-speed
workers: 8
keywords:
- mai_ya_tang,1,2,3,4
main_keyword: mai_ya_tang
test_pos_data_dir: /workspace/data/kws/training/marvin-mini/test_pos_3ch
test_pos_anno_dir: /workspace/data/kws/training/marvin-mini/test_annotation_3ch
test_neg_data_dir: /workspace/data/kws/training/marvin-mini/test_neg_3ch
train_pos_list:
- /workspace/data/kws/training/marvin-mini/positive_train_real_tts_container.txt,1.0
train_neg_list:
- /workspace/data/kws/training/marvin-mini/negative_train_container.txt,1.0

# Base stream: silence fixture makes this stream effectively clean.
single_noise1_list:
- /workspace/data/kws/training/marvin-mini/clean_silence_container.txt,1.0

# Fine-tune stream: preserve dynamic environmental augmentation.
multi_noise1_list:
- /workspace/data/kws/training/marvin-mini/noise_container.txt,1.0
train_interf_list:
- /workspace/data/kws/training/marvin-mini/noise_container.txt,1.0
train_ref_list:
- /workspace/data/kws/training/marvin-mini/noise_container.txt,1.0

# KWSDataset base-stream sampling probability.
single_rate: 0.35
# Dynamic positive-sample speed perturbation, applied with label alignment.
train_speed_range: 0.85,1.15
max_epochs: 1000
train_iters_per_epoch: 20
val_iters_per_epoch: 5
