<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyAgent</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; background: #f5f7fb; color: #172033; }
      main { max-width: 900px; height: 100vh; box-sizing: border-box; margin: 0 auto; padding: 24px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 16px; }
      header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 18px; border: 1px solid #e4e8f0; border-radius: 22px; background: rgba(255,255,255,.86); box-shadow: 0 10px 30px rgba(43, 56, 85, .07); }
      .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
      h1 { margin: 0; font-size: 1.15rem; letter-spacing: -.02em; }
      #status { margin-top: 3px; color: #69758c; font-size: .86rem; }
      .presence { display: flex; align-items: center; gap: 7px; color: #718096; font-size: .76rem; }
      .presence-dot { width: 7px; height: 7px; border-radius: 50%; background: #35b77a; box-shadow: 0 0 0 4px #e7f8ef; }
      #agent-orb { --orb-color: #5b6ee1; position: relative; width: 58px; height: 58px; flex: 0 0 58px; display: grid; place-items: center; }
      #agent-orb::before, #agent-orb::after { content: ""; position: absolute; inset: 5px; border: 1px solid color-mix(in srgb, var(--orb-color), transparent 66%); border-radius: 28% 72% 62% 38% / 42% 40% 60% 58%; transform: rotate(24deg); animation: orb-ring 8s linear infinite; }
      #agent-orb::after { inset: 1px; border-color: color-mix(in srgb, var(--orb-color), transparent 84%); transform: rotate(-32deg) scale(.84); animation-duration: 11s; animation-direction: reverse; }
      .orb-core { position: relative; z-index: 1; width: 27px; height: 27px; border-radius: 38% 62% 58% 42% / 45% 44% 56% 55%; background: radial-gradient(circle at 35% 28%, #fff 0 7%, color-mix(in srgb, var(--orb-color), white 28%) 18%, var(--orb-color) 72%); box-shadow: 0 8px 20px color-mix(in srgb, var(--orb-color), transparent 62%), 0 0 0 7px color-mix(in srgb, var(--orb-color), transparent 90%); animation: orb-breathe 3.8s ease-in-out infinite; }
      #agent-orb.state-listening { --orb-color: #0ca6a6; }
      #agent-orb.state-thinking { --orb-color: #8168e8; }
      #agent-orb.state-speaking { --orb-color: #ee8a45; }
      #agent-orb.state-shutdown { --orb-color: #9aa4b5; }
      #agent-orb.state-thinking::before { animation-duration: 2.2s; }
      #agent-orb.state-listening::before { animation: orb-listen 1.4s ease-out infinite; }
      #agent-orb.state-speaking .orb-core { animation: orb-speak .8s ease-in-out infinite alternate; }
      #conversation-panel { min-height: 0; overflow-y: auto; border: 1px solid #e4e8f0; border-radius: 22px; background: rgba(255,255,255,.72); padding: 18px; box-shadow: inset 0 1px 0 rgba(255,255,255,.8); }
      #messages { display: grid; gap: 12px; align-content: start; }
      .message { padding: 14px 16px; border-radius: 16px; white-space: pre-wrap; line-height: 1.58; box-shadow: 0 3px 10px rgba(43, 56, 85, .04); }
      .user { background: #e9efff; color: #28458c; margin-left: 15%; border: 1px solid #dbe5ff; }
      .assistant { background: #fff; color: #253047; margin-right: 15%; border: 1px solid #e5e9f1; }
      form { display: flex; gap: 10px; padding: 5px; border: 1px solid #e1e6ef; border-radius: 17px; background: #fff; box-shadow: 0 10px 30px rgba(43, 56, 85, .08); }
      input { flex: 1; min-width: 0; padding: 12px 13px; border: 0; outline: 0; border-radius: 12px; background: transparent; color: inherit; font-size: 1rem; }
      button { padding: 0 20px; border: 0; border-radius: 12px; background: #5264d9; color: #fff; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: .5; }
      @keyframes orb-breathe { 0%, 100% { transform: scale(.88); } 50% { transform: scale(1.08); } }
      @keyframes orb-ring { from { transform: rotate(24deg) scale(.94); } to { transform: rotate(384deg) scale(.94); } }
      @keyframes orb-listen { 0% { transform: scale(.82); opacity: .9; } 70%, 100% { transform: scale(1.25); opacity: 0; } }
      @keyframes orb-speak { from { transform: scale(.88) rotate(-5deg); } to { transform: scale(1.16) rotate(5deg); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
      @media (max-width: 640px) { main { padding: 14px; gap: 10px; } .user, .assistant { margin-left: 0; margin-right: 0; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="brand">
          <div id="agent-orb" class="state-standby" role="img" aria-label="MyAgent 正在待命"><span class="orb-core"></span></div>
          <div><h1>MyAgent</h1><div id="status" aria-live="polite">connecting…</div></div>
        </div>
        <div class="presence"><span class="presence-dot"></span> alive</div>
      </header>
      <section id="conversation-panel" aria-label="对话内容"><div id="messages" aria-live="polite"></div></section>
      <form id="input-form"><input id="input" autocomplete="off" placeholder="输入指令…" /><button>发送</button></form>
    </main>
    <script>
      const messages = document.querySelector('#messages');
      const conversationPanel = document.querySelector('#conversation-panel');
      const status = document.querySelector('#status');
      const orb = document.querySelector('#agent-orb');
      const input = document.querySelector('#input');
      const streamingMessages = new Map();
      const addMessage = (role, content) => {
        const node = document.createElement('div');
        node.className = `message ${role}`;
        node.textContent = content;
        messages.appendChild(node);
        conversationPanel.scrollTop = conversationPanel.scrollHeight;
        return node;
      };
      const source = new EventSource('/api/events');
      source.onopen = () => { status.textContent = 'online'; };
      source.onerror = () => { status.textContent = 'reconnecting…'; };
      const stateLabels = { initializing: 'initializing', standby: 'standby', listening: 'listening', thinking: 'thinking', speaking: 'speaking', shutdown: 'offline' };
      const applyState = state => {
        const name = state || 'standby';
        orb.className = `state-${name}`;
        orb.setAttribute('aria-label', `MyAgent ${stateLabels[name] || name}`);
        status.textContent = stateLabels[name] || name;
      };
      source.addEventListener('state_changed', event => {
        const data = JSON.parse(event.data);
        applyState(data.payload.state);
      });
      fetch('/api/state').then(response => response.json()).then(data => applyState(data.state)).catch(() => {});
      source.addEventListener('user_message', event => addMessage('user', JSON.parse(event.data).payload.content));
      source.addEventListener('assistant_message', event => addMessage('assistant', JSON.parse(event.data).payload.content));
      source.addEventListener('assistant_start', event => {
        const data = JSON.parse(event.data).payload;
        streamingMessages.set(data.message_id, addMessage('assistant', ''));
      });
      source.addEventListener('assistant_delta', event => {
        const data = JSON.parse(event.data).payload;
        const node = streamingMessages.get(data.message_id);
        if (node) {
          node.textContent += data.content;
          conversationPanel.scrollTop = conversationPanel.scrollHeight;
        }
      });
      source.addEventListener('assistant_end', event => {
        const data = JSON.parse(event.data).payload;
        const node = streamingMessages.get(data.message_id);
        if (node && !node.textContent) node.textContent = data.content || '';
        streamingMessages.delete(data.message_id);
      });
      document.querySelector('#input-form').addEventListener('submit', async event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        input.disabled = true;
        try {
          const response = await fetch('/api/input', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({text}) });
          if (!response.ok) throw new Error('input failed');
          input.value = '';
        } catch (error) { status.textContent = 'input error'; }
        input.disabled = false;
        input.focus();
      });
    </script>
  </body>
</html>
