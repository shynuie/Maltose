<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyAgent</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; background: #f5f7fb; color: #172033; }
      main { width: 100%; max-width: 1400px; height: 100vh; box-sizing: border-box; margin: 0 auto; padding: 24px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 16px; }
      header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 18px; border: 1px solid #e4e8f0; border-radius: 18px; background: rgba(255,255,255,.86); box-shadow: 0 10px 30px rgba(43, 56, 85, .07); }
      .brand { display: flex; align-items: center; gap: 18px; min-width: 0; }
      h1 { margin: 0; font-size: 1.15rem; letter-spacing: -.02em; }
      #status { margin-top: 3px; color: #69758c; font-size: .86rem; }
      .presence { display: flex; align-items: center; gap: 7px; color: #718096; font-size: .76rem; }
      .presence-dot { width: 7px; height: 7px; border-radius: 50%; background: #35b77a; box-shadow: 0 0 0 4px #e7f8ef; }
      .workspace { min-height: 0; display: grid; grid-template-columns: minmax(260px, .34fr) minmax(0, 1fr); gap: 16px; }
      .workspace > * { min-width: 0; }
      #agent-panel { min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; border: 1px solid #e4e8f0; border-radius: 22px; background: linear-gradient(155deg, #fff 0%, #f4f6ff 100%); box-shadow: 0 10px 30px rgba(43, 56, 85, .07); text-align: center; }
      #agent-panel #status { margin-top: 0; }
      #agent-orb { --orb-color: #5b6ee1; position: relative; width: 160px; height: 160px; flex: 0 0 160px; display: grid; place-items: center; }
      #agent-orb::before, #agent-orb::after { content: ""; position: absolute; inset: 5px; border: 1px solid color-mix(in srgb, var(--orb-color), transparent 66%); border-radius: 28% 72% 62% 38% / 42% 40% 60% 58%; transform: rotate(24deg); animation: orb-ring 8s linear infinite; }
      #agent-orb::after { inset: 1px; border-color: color-mix(in srgb, var(--orb-color), transparent 84%); transform: rotate(-32deg) scale(.84); animation-duration: 11s; animation-direction: reverse; }
      .orb-core { position: relative; z-index: 1; width: 66px; height: 66px; border-radius: 38% 62% 58% 42% / 45% 44% 56% 55%; background: radial-gradient(circle at 35% 28%, #fff 0 7%, color-mix(in srgb, var(--orb-color), white 28%) 18%, var(--orb-color) 72%); box-shadow: 0 10px 32px color-mix(in srgb, var(--orb-color), transparent 62%), 0 0 0 14px color-mix(in srgb, var(--orb-color), transparent 90%); animation: orb-breathe 3.8s ease-in-out infinite; }
      #agent-orb.state-listening { --orb-color: #0ca6a6; }
      #agent-orb.state-thinking { --orb-color: #8168e8; }
      #agent-orb.state-speaking { --orb-color: #ee8a45; }
      #agent-orb.state-shutdown { --orb-color: #9aa4b5; }
      #agent-orb.state-thinking::before { animation-duration: 2.2s; }
      #agent-orb.state-listening::before { animation: orb-listen 1.4s ease-out infinite; }
      #agent-orb.state-speaking .orb-core { animation: orb-speak .8s ease-in-out infinite alternate; }
      #agent-orb.state-standby::before { animation-duration: 13s; }
      #agent-orb.state-standby::after { animation-duration: 18s; }
      #agent-orb.state-standby .orb-core { animation-duration: 5.8s; }
      #agent-orb.state-thinking .orb-core { animation-duration: 2.4s; }
      #conversation-panel { min-height: 0; overflow-y: auto; border: 1px solid #e4e8f0; border-radius: 22px; background: rgba(255,255,255,.72); padding: 18px; box-shadow: inset 0 1px 0 rgba(255,255,255,.8); }
      #pinned-panel { display: none; min-height: 0; overflow-y: auto; border: 1px solid #e4e8f0; border-radius: 22px; background: rgba(255,255,255,.72); padding: 14px; box-shadow: inset 0 1px 0 rgba(255,255,255,.8); }
      .workspace.has-pinned { grid-template-columns: minmax(260px, .3fr) minmax(0, 1fr) minmax(320px, .42fr); }
      .workspace.has-pinned #pinned-panel { display: block; }
      .workspace.canvas-focus { grid-template-columns: minmax(360px, 1fr) minmax(600px, 1.8fr); }
      .workspace.canvas-focus #agent-panel { display: none; }
      .workspace.canvas-focus #pinned-panel { grid-column: 2; display: block; }
      .workspace.canvas-focus #conversation-panel { grid-column: 1; }
      #pinned-panel h2 { margin: 4px 4px 12px; color: #69758c; font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      #pinned-empty { margin: 30px 10px; color: #9aa4b5; font-size: .82rem; line-height: 1.5; text-align: center; }
      #pinned-blocks { display: grid; gap: 10px; }
      #pinned-blocks .ui-block { margin: 0; }
      .pinned-block { position: relative; }
      .pinned-block > .ui-title { padding-right: 28px; }
      .block-close { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; padding: 0; border-radius: 50%; background: #eef1f7; color: #68758c; font-size: 1rem; line-height: 1; }
      #messages { display: grid; gap: 12px; align-content: start; }
      .message { padding: 14px 16px; border-radius: 16px; white-space: pre-wrap; line-height: 1.58; box-shadow: 0 3px 10px rgba(43, 56, 85, .04); }
      .user { background: #e9efff; color: #28458c; margin-left: 15%; border: 1px solid #dbe5ff; }
      .assistant { background: #fff; color: #253047; margin-right: 15%; border: 1px solid #e5e9f1; }
      .ui-block { margin-right: 15%; padding: 15px 16px; border: 1px solid #dfe5ef; border-radius: 16px; background: #fff; box-shadow: 0 3px 10px rgba(43, 56, 85, .04); }
      .ui-title { margin: 0 0 8px; font-size: .92rem; }
      .ui-content { white-space: pre-wrap; color: #526078; line-height: 1.55; }
      .ui-progress-track { height: 8px; overflow: hidden; border-radius: 99px; background: #e8ecf4; }
      .ui-progress-value { height: 100%; border-radius: inherit; background: #5264d9; transition: width .25s ease; }
      .ui-progress-label { display: flex; justify-content: space-between; margin-top: 8px; color: #69758c; font-size: .78rem; }
      .ui-actions { display: flex; gap: 8px; margin-top: 12px; }
      .ui-actions button { padding: 8px 12px; }
      .link-list { display: grid; gap: 8px; }
      .link-card { display: block; padding: 10px 12px; border: 1px solid #e2e7f0; border-radius: 12px; background: #fbfcff; color: #3151bd; text-decoration: none; }
      .link-card:hover { border-color: #aab8ee; background: #f3f5ff; }
      .link-label { display: block; font-weight: 700; }
      .link-description { display: block; margin-top: 3px; color: #718096; font-size: .8rem; line-height: 1.4; }
      .timeline { display: grid; gap: 10px; }
      .timeline-item { display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: start; }
      .timeline-marker { width: 10px; height: 10px; margin-top: 5px; border-radius: 50%; background: #cbd3e2; box-shadow: 0 0 0 4px #f0f2f7; }
      .timeline-item.running .timeline-marker { background: #5264d9; box-shadow: 0 0 0 4px #e6e9ff; }
      .timeline-item.done .timeline-marker { background: #35b77a; box-shadow: 0 0 0 4px #e7f8ef; }
      .timeline-item.failed .timeline-marker { background: #df6a6a; box-shadow: 0 0 0 4px #fff0f0; }
      .timeline-label { font-weight: 700; }
      .timeline-detail { margin-top: 2px; color: #718096; font-size: .8rem; }
      .ui-table-wrap { overflow-x: auto; }
      .ui-table { width: 100%; border-collapse: collapse; color: #526078; font-size: .86rem; }
      .ui-table th, .ui-table td { padding: 9px 10px; border-bottom: 1px solid #e7ebf2; text-align: left; white-space: nowrap; }
      .ui-table th { color: #273653; font-weight: 700; }
      .canvas-wrap { overflow: auto; border-radius: 12px; background: #fbfcff; }
      .ui-canvas { display: block; min-width: 560px; width: 100%; height: auto; }
      form { display: flex; gap: 10px; padding: 5px; border: 1px solid #e1e6ef; border-radius: 17px; background: #fff; box-shadow: 0 10px 30px rgba(43, 56, 85, .08); }
      input { flex: 1; min-width: 0; padding: 12px 13px; border: 0; outline: 0; border-radius: 12px; background: transparent; color: inherit; font-size: 1rem; }
      button { padding: 0 20px; border: 0; border-radius: 12px; background: #5264d9; color: #fff; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: .5; }
      @keyframes orb-breathe { 0%, 100% { transform: scale(.88); } 50% { transform: scale(1.08); } }
      @keyframes orb-ring { from { transform: rotate(24deg) scale(.94); } to { transform: rotate(384deg) scale(.94); } }
      @keyframes orb-listen { 0% { transform: scale(.82); opacity: .9; } 70%, 100% { transform: scale(1.25); opacity: 0; } }
      @keyframes orb-speak { from { transform: scale(.88) rotate(-5deg); } to { transform: scale(1.16) rotate(5deg); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
      @media (max-width: 980px) { main { padding: 14px; gap: 10px; } header { padding: 12px 14px; } .workspace, .workspace.has-pinned, .workspace.canvas-focus { grid-template-columns: minmax(160px, .3fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; } .workspace.canvas-focus #agent-panel { display: flex; } #pinned-panel, .workspace.has-pinned #pinned-panel, .workspace.canvas-focus #pinned-panel { grid-column: 1 / -1; max-height: 220px; } }
      @media (max-width: 760px) { .workspace, .workspace.has-pinned, .workspace.canvas-focus { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr) auto; } #agent-panel, .workspace.canvas-focus #agent-panel { display: flex; flex-direction: row; justify-content: flex-start; gap: 14px; padding: 12px 16px; text-align: left; } #agent-orb { width: 76px; height: 76px; flex-basis: 76px; } .orb-core { width: 34px; height: 34px; } .user, .assistant { margin-left: 0; margin-right: 0; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="brand"><h1>MyAgent</h1></div>
        <div class="presence"><span class="presence-dot"></span> alive</div>
      </header>
      <section class="workspace" aria-label="Agent workspace">
        <aside id="agent-panel" aria-label="Agent 状态">
          <div id="agent-orb" class="state-standby" role="img" aria-label="MyAgent 正在待命"><span class="orb-core"></span></div>
          <div><div id="status" aria-live="polite">connecting…</div></div>
        </aside>
        <section id="conversation-panel" aria-label="对话内容"><div id="messages" aria-live="polite"></div></section>
        <aside id="pinned-panel" aria-label="固定工作区">
          <h2>Workspace</h2>
          <div id="pinned-empty">需要持续关注的进度、画布和确认会显示在这里。</div>
          <div id="pinned-blocks"></div>
        </aside>
      </section>
      <form id="input-form"><input id="input" autocomplete="off" placeholder="输入指令…" /><button>发送</button></form>
    </main>
    <script>
      const messages = document.querySelector('#messages');
      const conversationPanel = document.querySelector('#conversation-panel');
      const workspace = document.querySelector('.workspace');
      const pinnedBlocks = document.querySelector('#pinned-blocks');
      const pinnedEmpty = document.querySelector('#pinned-empty');
      const status = document.querySelector('#status');
      const orb = document.querySelector('#agent-orb');
      const input = document.querySelector('#input');
      const streamingMessages = new Map();
      const progressBlocks = new Map();
      const pinnedScenes = new Map();
      const pinnedBlocksById = new Map();
      const pinnedTypes = new Set(['ui_progress', 'ui_timeline', 'ui_canvas', 'ui_confirmation']);
      const isPinned = data => data.presentation === 'pinned' || pinnedTypes.has(data.block_type);
      const syncPinnedLayout = () => {
        const hasPinned = pinnedBlocks.children.length > 0;
        const hasCanvas = canvasScenes.size > 0;
        workspace.classList.toggle('has-pinned', hasPinned);
        workspace.classList.toggle('canvas-focus', hasCanvas);
        pinnedEmpty.hidden = hasPinned;
      };
      const closePinned = (blockId, node) => {
        node.remove();
        pinnedBlocksById.delete(blockId);
        progressBlocks.delete(blockId);
        canvasScenes.delete(blockId);
        syncPinnedLayout();
        fetch('/api/action', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({action_id: 'ui.close', value: {block_id: blockId}}) }).catch(() => {});
      };
      const addCloseButton = (node, blockId) => {
        if (!blockId) return;
        node.classList.add('pinned-block');
        const close = document.createElement('button');
        close.className = 'block-close'; close.type = 'button'; close.title = 'Close'; close.setAttribute('aria-label', 'Close'); close.textContent = '×';
        close.addEventListener('click', () => closePinned(blockId, node));
        node.appendChild(close);
        pinnedBlocksById.set(blockId, node);
        pinnedEmpty.hidden = true;
      };
      const urlPattern = /(https?:\/\/[^\s<>"']+)/gi;
      const renderRichText = (node, content) => {
        node.replaceChildren();
        let cursor = 0;
        for (const match of content.matchAll(urlPattern)) {
          const start = match.index;
          const rawUrl = match[0];
          const url = rawUrl.replace(/[.,!?;:，。！？；：)\]}]+$/g, '');
          node.append(document.createTextNode(content.slice(cursor, start)));
          try {
            const parsed = new URL(url);
            if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') throw new Error('unsupported protocol');
            const link = document.createElement('a');
            link.href = parsed.href;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = url;
            node.append(link);
            node.append(document.createTextNode(rawUrl.slice(url.length)));
          } catch (_) {
            node.append(document.createTextNode(rawUrl));
          }
          cursor = start + rawUrl.length;
        }
        node.append(document.createTextNode(content.slice(cursor)));
      };
      const addMessage = (role, content) => {
        const node = document.createElement('div');
        node.className = `message ${role}`;
        renderRichText(node, content);
        messages.appendChild(node);
        conversationPanel.scrollTop = conversationPanel.scrollHeight;
        return node;
      };
      const source = new EventSource('/api/events');
      source.onopen = () => { status.textContent = 'online'; };
      source.onerror = () => { status.textContent = 'reconnecting…'; };
      const stateLabels = { initializing: 'initializing', standby: 'standby', listening: 'listening', thinking: 'thinking', speaking: 'speaking', shutdown: 'offline' };
      const applyState = state => {
        const name = state || 'standby';
        orb.className = `state-${name}`;
        orb.setAttribute('aria-label', `MyAgent ${stateLabels[name] || name}`);
        status.textContent = stateLabels[name] || name;
      };
      source.addEventListener('state_changed', event => {
        const data = JSON.parse(event.data);
        applyState(data.payload.state);
      });
      fetch('/api/state').then(response => response.json()).then(data => applyState(data.state)).catch(() => {});
      source.addEventListener('user_message', event => addMessage('user', JSON.parse(event.data).payload.content));
      source.addEventListener('assistant_message', event => addMessage('assistant', JSON.parse(event.data).payload.content));
      source.addEventListener('assistant_start', event => {
        const data = JSON.parse(event.data).payload;
        streamingMessages.set(data.message_id, { node: addMessage('assistant', ''), content: '' });
      });
      source.addEventListener('assistant_delta', event => {
        const data = JSON.parse(event.data).payload;
        const message = streamingMessages.get(data.message_id);
        if (message) {
          message.content += data.content;
          renderRichText(message.node, message.content);
          conversationPanel.scrollTop = conversationPanel.scrollHeight;
        }
      });
      source.addEventListener('assistant_end', event => {
        const data = JSON.parse(event.data).payload;
        const message = streamingMessages.get(data.message_id);
        if (message && !message.content) renderRichText(message.node, data.content || '');
        streamingMessages.delete(data.message_id);
      });
      const renderLinkList = (links, title) => {
        const node = document.createElement('article');
        node.className = 'ui-block';
        if (title) {
          const heading = document.createElement('h3');
          heading.className = 'ui-title';
          heading.textContent = title;
          node.appendChild(heading);
        }
        const list = document.createElement('div');
        list.className = 'link-list';
        (Array.isArray(links) ? links : []).forEach(item => {
          if (!item || typeof item.url !== 'string') return;
          try {
            const parsed = new URL(item.url);
            if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return;
            const link = document.createElement('a');
            link.className = 'link-card';
            link.href = parsed.href;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            const label = document.createElement('span');
            label.className = 'link-label';
            label.textContent = item.label || parsed.hostname;
            link.appendChild(label);
            if (item.description) {
              const description = document.createElement('span');
              description.className = 'link-description';
              description.textContent = item.description;
              link.appendChild(description);
            }
            list.appendChild(link);
          } catch (_) { /* Ignore malformed or unsafe URLs. */ }
        });
        node.appendChild(list);
        messages.appendChild(node);
        conversationPanel.scrollTop = conversationPanel.scrollHeight;
      };
      const canvasScenes = new Map();
      const normalizeCanvasElements = rawElements => {
        const elements = Array.isArray(rawElements) ? rawElements : [];
        const positioned = elements.filter(item => item && (item.type === 'node' || item.type === 'text'));
        if (!positioned.length) return elements;
        const bounds = positioned.reduce((result, item) => {
          const x = Number(item.x) || 0, y = Number(item.y) || 0;
          const width = item.type === 'node' ? (Number(item.width) || 150) : 0;
          const height = item.type === 'node' ? (Number(item.height) || 56) : 0;
          return { minX: Math.min(result.minX, x), minY: Math.min(result.minY, y), maxX: Math.max(result.maxX, x + width), maxY: Math.max(result.maxY, y + height) };
        }, {minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity});
        const padding = 40, canvasWidth = 800, canvasHeight = 450;
        const width = Math.max(1, bounds.maxX - bounds.minX), height = Math.max(1, bounds.maxY - bounds.minY);
        const scale = Math.min(1, (canvasWidth - padding * 2) / width, (canvasHeight - padding * 2) / height);
        const offsetX = (canvasWidth - width * scale) / 2, offsetY = (canvasHeight - height * scale) / 2;
        return elements.map(item => {
          if (!item || (item.type !== 'node' && item.type !== 'text')) return item;
          const next = {...item, x: ((Number(item.x) || 0) - bounds.minX) * scale + offsetX, y: ((Number(item.y) || 0) - bounds.minY) * scale + offsetY};
          if (item.type === 'node') { next.width = (Number(item.width) || 150) * scale; next.height = (Number(item.height) || 56) * scale; }
          return next;
        });
      };
      const renderCanvas = data => {
        const sceneId = data.scene_id || `scene-${Date.now()}`;
        const old = canvasScenes.get(sceneId);
        const node = old || document.createElement('article');
        node.className = 'ui-block';
        node.replaceChildren();
        const heading = document.createElement('h3');
        heading.className = 'ui-title';
        heading.textContent = data.title || 'Canvas';
        node.appendChild(heading);
        const wrap = document.createElement('div');
        wrap.className = 'canvas-wrap';
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.classList.add('ui-canvas');
        svg.setAttribute('viewBox', '0 0 800 450');
        svg.setAttribute('role', 'img');
        svg.setAttribute('aria-label', data.title || 'Agent diagram');
        const elements = normalizeCanvasElements(data.elements);
        const nodes = new Map();
        const arrowheads = [];
        const number = (value, fallback) => Number.isFinite(Number(value)) ? Number(value) : fallback;
        const color = value => /^#[0-9a-f]{3,8}$/i.test(value || '') ? value : '#5264d9';
        elements.filter(item => item && item.type === 'node').forEach(item => {
          const x = number(item.x, 40), y = number(item.y, 40), width = number(item.width, 150), height = number(item.height, 56);
          nodes.set(item.id, {x, y, width, height});
        });
        const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
        const markerId = `arrow-${String(sceneId).replace(/[^A-Za-z0-9_-]/g, '-')}`;
        marker.setAttribute('id', markerId); marker.setAttribute('viewBox', '0 0 10 10'); marker.setAttribute('markerWidth', '10'); marker.setAttribute('markerHeight', '10'); marker.setAttribute('refX', '9'); marker.setAttribute('refY', '5'); marker.setAttribute('orient', 'auto'); marker.setAttribute('markerUnits', 'userSpaceOnUse');
        const markerPath = document.createElementNS('http://www.w3.org/2000/svg', 'path'); markerPath.setAttribute('d', 'M0,0 L10,5 L0,10 z'); markerPath.setAttribute('fill', '#8995aa'); marker.appendChild(markerPath);
        const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs'); defs.appendChild(marker); svg.appendChild(defs);
        elements.filter(item => item && item.type === 'arrow').forEach(item => {
          const from = nodes.get(item.from), to = nodes.get(item.to); if (!from || !to) return;
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          const x1 = from.x + from.width / 2, y1 = from.y + from.height / 2;
          const targetX = to.x + to.width / 2, targetY = to.y + to.height / 2;
          const dx = targetX - x1, dy = targetY - y1;
          const edgeScale = Math.min(
            Math.abs(dx) > 0.001 ? (to.width / 2) / Math.abs(dx) : Infinity,
            Math.abs(dy) > 0.001 ? (to.height / 2) / Math.abs(dy) : Infinity,
          );
          const x2 = targetX - dx * edgeScale, y2 = targetY - dy * edgeScale;
          line.setAttribute('x1', x1); line.setAttribute('y1', y1); line.setAttribute('x2', x2); line.setAttribute('y2', y2); line.setAttribute('stroke', '#8995aa'); line.setAttribute('stroke-width', '2'); line.setAttribute('marker-end', `url(#${markerId})`); svg.appendChild(line);
          const angle = Math.atan2(y2 - y1, x2 - x1), size = 11, wing = 5;
          const points = `${x2},${y2} ${x2 - size * Math.cos(angle) + wing * Math.sin(angle)},${y2 - size * Math.sin(angle) - wing * Math.cos(angle)} ${x2 - size * Math.cos(angle) - wing * Math.sin(angle)},${y2 - size * Math.sin(angle) + wing * Math.cos(angle)}`;
          const arrowhead = document.createElementNS('http://www.w3.org/2000/svg', 'polygon'); arrowhead.setAttribute('points', points); arrowhead.setAttribute('fill', '#8995aa'); arrowheads.push(arrowhead);
        });
        elements.filter(item => item && item.type === 'node').forEach(item => {
          const box = nodes.get(item.id); if (!box) return;
          const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect'); rect.setAttribute('x', box.x); rect.setAttribute('y', box.y); rect.setAttribute('width', box.width); rect.setAttribute('height', box.height); rect.setAttribute('rx', '12'); rect.setAttribute('fill', '#fff'); rect.setAttribute('stroke', color(item.color)); rect.setAttribute('stroke-width', '2'); group.appendChild(rect);
          const label = document.createElementNS('http://www.w3.org/2000/svg', 'text'); label.setAttribute('x', box.x + box.width / 2); label.setAttribute('y', box.y + box.height / 2 + 5); label.setAttribute('text-anchor', 'middle'); label.setAttribute('fill', '#273653'); label.setAttribute('font-size', '14'); label.textContent = item.label || item.id || 'Node'; group.appendChild(label); svg.appendChild(group);
        });
        arrowheads.forEach(arrowhead => svg.appendChild(arrowhead));
        elements.filter(item => item && item.type === 'text').forEach(item => { const text = document.createElementNS('http://www.w3.org/2000/svg', 'text'); text.setAttribute('x', number(item.x, 40)); text.setAttribute('y', number(item.y, 40)); text.setAttribute('fill', '#526078'); text.setAttribute('font-size', '14'); text.textContent = item.label || ''; svg.appendChild(text); });
        wrap.appendChild(svg); node.appendChild(wrap);
        if (!old) { pinnedBlocks.appendChild(node); canvasScenes.set(sceneId, node); }
        addCloseButton(node, sceneId);
        syncPinnedLayout();
        conversationPanel.scrollTop = conversationPanel.scrollHeight;
      };
      source.addEventListener('ui_block', event => {
        const data = JSON.parse(event.data).payload;
        if (data.block_type === 'ui_links') {
          renderLinkList(data.links, data.title || 'Links');
          return;
        }
        if (data.block_type === 'ui_canvas') {
          renderCanvas(data);
          return;
        }
        const node = document.createElement('article');
        node.className = 'ui-block';
        node.dataset.blockType = data.block_type;
        const pinned = isPinned(data);
        if (data.block_type === 'ui_timeline') {
          node.innerHTML = `<h3 class="ui-title"></h3><div class="timeline"></div>`;
          node.querySelector('.ui-title').textContent = data.title || 'Timeline';
          (Array.isArray(data.items) ? data.items : []).forEach(item => {
            const row = document.createElement('div');
            row.className = `timeline-item ${item.status || 'pending'}`;
            row.innerHTML = `<span class="timeline-marker"></span><div><div class="timeline-label"></div><div class="timeline-detail"></div></div>`;
            row.querySelector('.timeline-label').textContent = item.label || '';
            row.querySelector('.timeline-detail').textContent = item.detail || '';
            node.querySelector('.timeline').appendChild(row);
          });
        } else if (data.block_type === 'ui_table') {
          node.innerHTML = `<h3 class="ui-title"></h3><div class="ui-table-wrap"><table class="ui-table"><thead></thead><tbody></tbody></table></div>`;
          node.querySelector('.ui-title').textContent = data.title || 'Table';
          const header = node.querySelector('thead').insertRow();
          (Array.isArray(data.columns) ? data.columns : []).forEach(column => { const cell = document.createElement('th'); cell.textContent = column; header.appendChild(cell); });
          (Array.isArray(data.rows) ? data.rows : []).forEach(rowData => {
            const row = node.querySelector('tbody').insertRow();
            (Array.isArray(rowData) ? rowData : []).forEach(value => { const cell = row.insertCell(); cell.textContent = value == null ? '' : String(value); });
          });
        } else if (data.block_type === 'ui_progress') {
          const progressId = data.progress_id || `progress-${Date.now()}-${Math.random()}`;
          const existing = progressBlocks.get(progressId);
          if (existing) {
            existing.querySelector('.ui-title').textContent = data.title || 'Progress';
            existing.querySelector('.ui-progress-value').style.width = `${Math.max(0, Math.min(100, Number(data.percent || 0)))}%`;
            existing.querySelector('.ui-progress-percent').textContent = `${Math.max(0, Math.min(100, Number(data.percent || 0)))}%`;
            existing.querySelector('.ui-progress-text').textContent = data.text || data.status || '';
            if (data.status === 'succeeded' || data.status === 'failed' || data.status === 'cancelled') progressBlocks.delete(progressId);
            conversationPanel.scrollTop = conversationPanel.scrollHeight;
            return;
          }
          const value = Math.max(0, Math.min(100, Number(data.percent || 0)));
          node.innerHTML = `<h3 class="ui-title"></h3><div class="ui-progress-track"><div class="ui-progress-value"></div></div><div class="ui-progress-label"><span class="ui-progress-text"></span><span class="ui-progress-percent">${value}%</span></div>`;
          node.querySelector('.ui-title').textContent = data.title || 'Progress';
          node.querySelector('.ui-progress-value').style.width = `${value}%`;
          node.querySelector('.ui-progress-text').textContent = data.text || data.status || '';
          progressBlocks.set(progressId, node);
        } else if (data.block_type === 'ui_confirmation') {
          node.innerHTML = `<h3 class="ui-title"></h3><div class="ui-content"></div><div class="ui-actions"></div>`;
          node.querySelector('.ui-title').textContent = data.title || 'Confirmation';
          node.querySelector('.ui-content').textContent = data.content || '';
          const actions = Array.isArray(data.actions) ? data.actions : [{id: 'confirm', label: 'Confirm'}];
          actions.forEach(action => {
            const button = document.createElement('button');
            button.textContent = action.label || action.id;
            button.addEventListener('click', async () => {
              button.disabled = true;
              await fetch('/api/action', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({action_id: action.id, value: data.value}) });
            });
            node.querySelector('.ui-actions').appendChild(button);
          });
        } else {
          node.innerHTML = `<h3 class="ui-title"></h3><div class="ui-content"></div>`;
          node.querySelector('.ui-title').textContent = data.title || (data.block_type === 'ui_markdown' ? 'Note' : 'Agent');
          node.querySelector('.ui-content').textContent = data.content || '';
        }
        (pinned ? pinnedBlocks : messages).appendChild(node);
        if (pinned) addCloseButton(node, data.block_id || data.progress_id || data.action_id || data.title || `block-${Date.now()}`);
        syncPinnedLayout();
        conversationPanel.scrollTop = conversationPanel.scrollHeight;
      });
      document.querySelector('#input-form').addEventListener('submit', async event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        input.disabled = true;
        try {
          const response = await fetch('/api/input', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({text}) });
          if (!response.ok) throw new Error('input failed');
          input.value = '';
        } catch (error) { status.textContent = 'input error'; }
        input.disabled = false;
        input.focus();
      });
    </script>
  </body>
</html>
