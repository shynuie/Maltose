name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python3 -m venv .venv && .venv/bin/python -m pip install -r requirements-dev.lock uv==0.13.5
      - run: npm test && ./scripts/bundle-renderer.sh
      - run: ./scripts/swift-test.sh
      - run: .venv/bin/python -m pytest tests/protocol tests/integration tests/security -q
