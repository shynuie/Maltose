[project]
name = "myagent"
version = "0.1.0"
description = "Early-stage personal assistant project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.1.1",
]

[project.scripts]
myagent-stt = "myagent.voice.stt_cli:main"
myagent-tts = "myagent.voice.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
