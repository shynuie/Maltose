[project]
name = "myagent"
version = "0.1.0"
description = "Early-stage personal assistant project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.1.1",
    "sounddevice>=0.5.0",
    "webrtcvad-wheels>=2.0.14",
]

[project.optional-dependencies]
wake = [
    "pypinyin>=0.55.0",
    "sentencepiece>=0.2.0",
    "sherpa-onnx",
    "sherpa-onnx-core==1.13.8",
]
funasr = [
    "funasr>=1.3.0",
    "kaldi-native-fbank>=1.21.0",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "transformers==4.57.6",
]
qwen-asr = [
    "qwen-asr>=0.0.6",
    "transformers==4.57.6",
]

[project.scripts]
myagent = "myagent.agent.cli:main"
myagent-run = "myagent.agent.cli:main"
myagent-listen = "myagent.voice.listen_cli:main"
myagent-stt = "myagent.voice.stt_cli:main"
myagent-tts = "myagent.voice.cli:main"
myagent-voice-loop = "myagent.voice.loop_cli:main"
myagent-wake-test = "myagent.voice.wake_cli:main"
myagent-wake-monitor = "myagent.voice.wake_monitor_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
